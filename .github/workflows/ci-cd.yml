name: CI
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Lint
      run: npm run lint || true
      working-directory: frontend
      continue-on-error: true
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Test
      run: npm test || true
      working-directory: frontend
      continue-on-error: true
  build:
    runs-on: ubuntu-latest
    needs:
    - lint
    - test
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Build
      run: npm run build
      working-directory: frontend
