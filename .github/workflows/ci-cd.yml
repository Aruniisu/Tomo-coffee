name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # <‑‑ make lint non‑blocking
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install root deps
        run: npm install
      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    continue-on-error: true   # <‑‑ make test non‑blocking
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install root deps
        run: npm install
      - name: Run tests (placeholder)
        run: echo "No tests defined" || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Build frontend
        run: npm run build   # uses script "cd frontend && npm install && npm run build"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy placeholder
        run: echo "Deploy step – unchanged"
