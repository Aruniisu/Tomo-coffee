name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || true
        working-directory: ./frontend
      - name: Run ESLint
        run: npm run lint || true
        working-directory: ./frontend

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || true
        working-directory: ./frontend
      - name: Run tests
        run: npm test -- --watchAll=false || true
        working-directory: ./frontend

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend (optional)
        run: python backend/app.py

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy step placeholder
        run: echo "Deploying..."
