name: CI
true:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Run Lint
      working-directory: frontend
      run: npm run lint || true
      continue-on-error: true
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Run Tests
      working-directory: frontend
      run: npm run test || true
      continue-on-error: true
  build:
    runs-on: ubuntu-latest
    needs:
    - lint
    - test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Build Application
      working-directory: frontend
      run: npm run build
