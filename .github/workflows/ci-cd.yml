name: CI
true:
- push
- pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      working-directory: frontend
      run: npm ci || npm install
    - name: Lint
      working-directory: frontend
      run: npm run lint || true
      continue-on-error: true
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      working-directory: frontend
      run: npm ci || npm install
    - name: Test
      working-directory: frontend
      run: npm test || true
      continue-on-error: true
  build:
    runs-on: ubuntu-latest
    needs:
    - lint
    - test
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      working-directory: frontend
      run: npm ci || npm install
    - name: Build
      working-directory: frontend
      run: npm run build
